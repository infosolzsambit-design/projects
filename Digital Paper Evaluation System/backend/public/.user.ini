; Read automatically by PHP-FPM (per-directory, no root access needed) on
; hosts that use it — the same overrides applied directly to php.ini on the
; local dev machine's CLI SAPI (php artisan serve reads that one instead,
; since .user.ini isn't consulted by PHP's built-in server). Needed for the
; Answer Sheet Upload feature's batches of PDFs — see
; AnswerSheetUploadView.vue's UPLOAD_BATCH_SIZE and this app's own default
; caps (upload_max_filesize=20M, post_max_size=25M, max_file_uploads=20)
; being far too small for even one batch otherwise.
upload_max_filesize = 1024M
post_max_size = 2048M
max_file_uploads = 1000
max_execution_time = 300
max_input_time = 300
memory_limit = 1024M
